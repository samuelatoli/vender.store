{% extends 'base.html' %}
{% block content %}
  <h2>Upload Product</h2>
  {% if session.email %}
  <form method="post" enctype="multipart/form-data">
    <label>Name<br><input type="text" name="name" required></label><br>
    <label>Description<br><textarea name="description" rows="4"></textarea></label><br>
    <label>Contact (email/phone)<br><input type="text" name="contact"></label><br>
    <label>Website URL<br><input type="text" name="website" placeholder="https://example.com"></label><br>
    <label>Social media links<br><input type="text" name="social_links" placeholder="Instagram, Facebook, TikTok, etc. Separate links with commas"></label><br>
    <label>Price<br><input type="number" step="0.01" name="price"></label><br>
    <label>Image (optional)<br><input type="file" name="image" accept="image/*"></label><br>
    <button type="submit">Upload</button>
  </form>
  {% else %}
    <p>Please <a href="{{ url_for('login') }}">log in</a> to upload products, or <a href="{{ url_for('signup') }}">create an account</a>.</p>
  {% endif %}
{% endblock %}
