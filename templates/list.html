{% extends 'base.html' %}
{% block content %}
  <h2>Products</h2>
  {% if not products %}
    <p>No products yet. <a href="/upload">Add one</a>.</p>
  {% else %}
    <div class="grid">
    {% for p in products %}
      <div class="card">
        <h3>{{ p[1] }}</h3>
        {% if p[5] %}
          <a href="/uploads/{{ p[5] }}"><img src="/uploads/{{ p[5] }}" alt="{{ p[1] }}"></a>
        {% endif %}
        <p>{{ p[2] }}</p>
        <p><strong>Price:</strong> ${{ '%.2f'|format(p[4]) }}</p>
        <p><strong>Contact:</strong> {{ p[3] }}</p>
      </div>
    {% endfor %}
    </div>
  {% endif %}
{% endblock %}
